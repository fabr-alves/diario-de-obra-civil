<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Obra</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Compilador React/Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos de Proteção e Design -->
    <style>
      :root { color-scheme: light; }
      body, html { background-color: #f9fafb !important; color: #111827 !important; font-family: sans-serif; }
      button, input, select, textarea, .rounded-xl, .rounded-lg, .rounded-2xl { border-radius: 12px !important; }
      input, select, textarea { background-color: #ffffff !important; color: #000000 !important; border: 1px solid #e5e7eb !important; }
      .rounded-full { border-radius: 9999px !important; }
      
      @media print {
        @page { size: A4; margin: 15mm; }
        .print\:break-after-page { page-break-after: always; }
      }
      
      .pin-drop { animation: drop 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
      @keyframes drop { 0% { transform: translate(-50%, -200%); opacity: 0; } 100% { transform: translate(-50%, -100%); opacity: 1; } }
      
      .hide-scroll::-webkit-scrollbar { display: none; }
      .hide-scroll { 
         -ms-overflow-style: none; scrollbar-width: none; overscroll-behavior: none; 
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
    </style>

    <!-- Mapeamento de Bibliotecas React e Ícones -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from "react";
        import { ADMIN_UID, DEFAULT_MAP, actorFor, draftKey, emptyForm, auditFields, optimizeImage, formatBytes, formatAuditDate, logPayload } from './app-utils.mjs';
        import {employeeKey, inferEmployeeColumn, extractEmployees, compareEmployees, readEmployeeWorkbook} from './employees.mjs';
        import { createRoot } from "react-dom/client";
        
        // Importações Seguras do Firebase Cloud
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, deleteDoc, doc, serverTimestamp, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
        
        // Importações de Ícones
        import { Sun, Cloud, CloudRain, Hammer, ClipboardList, Calendar, Trash2, Plus, ChevronLeft, Printer, CheckCircle2, MapPin, User, Briefcase, X, BarChart3, Lock, LogOut, Camera, Loader2, Download, Pencil, Upload, Map as MapIcon, Check } from "lucide-react";

        // --- SUAS CHAVES DO FIREBASE ---
        const firebaseConfig = {
          apiKey: "AIzaSyDr7eviIEUdKQRAG2ahqtdDTfGOXFEG7UM",
          authDomain: "diarioobra-60aca.firebaseapp.com",
          projectId: "diarioobra-60aca",
          storageBucket: "diarioobra-60aca.firebasestorage.app",
          messagingSenderId: "948386755668",
          appId: "1:948386755668:web:a180d988fae131249d69c1",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const DOMINIO_PADRAO = "@obra.com";
        const DB_COLLECTION = "diarios_final";
        const LOGO_URL = "https://firebasestorage.googleapis.com/v0/b/diarioobra-60aca.firebasestorage.app/o/logoconsorcio.jpg?alt=media&token=59bbd5e0-d4e8-4ba1-9fca-5b548b64b6be";



        const COORDENADAS_MAPA = {
          "ADM": [50.5, 30.2],
          "ATERRO": [25.0, 75.0],
          "CENTRO OESTE": [60.0, 45.0],
          "NORTE-01": [15.5, 20.0],
          "NORTE-02": [80.0, 80.0],
          "PORTARIA": [90.0, 10.0],
          "CAIXARIAS": [40.0, 60.0],
        };

        const LOCAIS_PRODUCAO = [
          "DESCIDA D'AGUA", "CAIXARIAS", "CANALETA", "GALERIAS", "EDIFICAÇÕES", "ATERRO",
        ];

        const LOCAIS_SETOR = [
          "ADM", "ATERRO", "CENTRO OESTE", "AUSENTE", "MANUTENÇÃO PORTARIA", "PORTARIA", 
          "PROXIMA HIDROS", "ROO-02", "RQQ 01", "RQQ 02", "SUSTENTARE",
          "Norte 5 N-5", "Norte 4 N-4", "Norte 3 N-3", "Norte 2 N-2", "Norte 1 N-1",
          "Leste 1 E-1", "Leste 2 E-2", "Leste 3 E-3", "Leste 4 E-4",
          "Sul 1 S-1", "Sul 2 S-2", "Sul 3 S-3",
          "Sudeste 1 SE-1", "Sudeste 2 SE-2",
          "Sudoeste 1 SW-1", "Sudoeste 2 SW-2", "Sudoeste 3 SW-3",
          "Oeste 1 W-1", "Noroeste 1 NW-1"
        ].sort();

        const ITENS = [
          "GEOCÉLULA/M²", "LONA (PRETA)/M²", "RACHÃO/M³", "TUBO/UNI", "FERRO/UNI 3/8''",
          "AREIA/M³", "BRITA 1/M³", "RAFIA/UNI", "LIMPEZA M³", "LIMPEZA LINEAR",
          "BLOCO/UNI", "FERRO/UNI", "TELA/M²", "CIMENTO/UNI", "BGS", "CONSTRUÇÃO",
          "GEOMB / M²", "GEOTÊXTIL/M²", "FERRAG. / DIV", "PRODUTIVIDADE LINEAR",
          "PRODUTIDADE M²", "GRAMA LINEAR", "GRAMA M²", "SERVIÇOS DIVERSOS/OUTROS",
          "LONA DE SACRIFÍCIO/M²", "ROÇAGEM ML", "ROÇAGEM M²",
          "Tubo de 400mm PB", "Tubo de 600mm PB", "Tubo de 800mm PB", "Tubo de 1200mm PB"
        ].sort();

        const FUNCIONARIOS = [
          "ALAN ALVES SIQUEIRA", "ALEXANDRE SOUZA SIQUEIRA", "ANTONIO ALCEMIR ALVES DE CASTRO", 
          "DAMIÃO HELIO FELIX DOMINGOS", "DARLEI RAMOS DOS SANTOS",
          "DAVI JUNIO FERREIRA DE SOUSA", "DENIVALDO ALVES DE OLIVEIRA",
          "JAKSON JUNIOR LOPES DA SILVA", "JANDIEL DOS SANTOS SILVA",
          "JOCEONE TELES DOS SANTOS", "MANOEL APOLINARIO MOURA DA SILVA", 
          "MARCIO ROBERTO DOS SANTOS", "PAULO CANDIDO DE SOUSA", 
          "ROGERIO SANTOS SALES", "SAMUEL DA SILVA FERREIRA", 
          "SEBASTIAO MESSIAS DE SOUSA", "WANDERSON DA SILVA CHAGAS",
        ].sort();

        const SERVICOS = [
          "AUXILIANDO OFICINA", "CANALETA", "COLOCANDO COMPOSTO", "CONSTRUINDO CANALETA",
          "COZINHA", "DENCIDADE INSITO", "DESCIDA D'ÁGUA", "DESCIDA HIDRAULICA",
          "ENCABEÇANDO DESCIDA", "FRENTE OPERAÇÃO", "GRAVIMETRIA", "GRAMA LINEAR", "GRAMA M²",
          "IMPLANTANDO QUEIMADOR", "LIMPEZA D/BERMAS", "LIMPEZA D/CAIXA", "LIMPEZA EMISSÁRIO", 
          "LIMPEZA PREDIAL", "MANUTENÇÃO", "MANUTENÇÃO CANALETA", "MANUTENÇÃO E LIMPEZA",
          "MANUTENÇÃO PORTARIA", "MONTANDO QUEIMADOR", "PLANTIO DE GRAMA", "PORTARIA",
          "PREPARANDO SOLO P/GRAMA", "REFORMA CAIXARIA", "RESPONDENDO OFICIO",
          "ROÇAGEM", "SERVIÇOS GERAIS", "TIRANDO AFLORAMENTO", "TREINAMENTO",
          "SERVIÇOS DIVERSOS/OUTROS", "COLOCANDO LONA SACRIFÍCIO", "FALTA", "ATESTADO", "FOLGA",
        ].sort();

        const EmployeeSettings = ({user, current, fallback, onClose}) => {
          const [sheets,setSheets]=useState([]), [sheetIndex,setSheetIndex]=useState(0);
          const [column,setColumn]=useState(0), [firstRow,setFirstRow]=useState(2);
          const [fileName,setFileName]=useState(''), [month,setMonth]=useState(new Date().toISOString().slice(0,7));
          const [mode,setMode]=useState('replace'), [excluded,setExcluded]=useState(new Set());
          const [accepted,setAccepted]=useState(false), [busy,setBusy]=useState(false), [error,setError]=useState('');
          const [baseVersion,setBaseVersion]=useState('legacy'), [restoring,setRestoring]=useState(null), [done,setDone]=useState(null);
          const lock=useRef(false);
          const currentNames=current.employeeNames || fallback;
          const sheet=sheets[sheetIndex];
          let extracted={names:[],rejected:[],duplicates:[],blanks:0}, diff=null, previewError='';
          try {
            if(restoring)extracted={...extracted,names:restoring};
            else if(sheet){if(sheet.error)throw new Error(sheet.error);extracted=extractEmployees(sheet.rows,column,firstRow);}
            if(extracted.names.length)diff=compareEmployees(currentNames,extracted.names.filter(name=>!excluded.has(employeeKey(name))),mode);
          }catch(err){previewError=err.message;}
          const resetConfirm=()=>{setAccepted(false);setError('');setDone(null);};
          const chooseSheet=index=>{
            setSheetIndex(index); const hint=inferEmployeeColumn(sheets[index].rows);
            setColumn(hint.column);setFirstRow(hint.firstRow);setExcluded(new Set());resetConfirm();
          };
          const choose=async e=>{
            const file=e.target.files?.[0];e.target.value='';if(!file || lock.current)return;
            lock.current=true;setBusy(true);setSheets([]);setRestoring(null);setExcluded(new Set());resetConfirm();
            const version=current.employeeVersion || 'legacy';
            try {
              const data=await readEmployeeWorkbook(file);const hint=inferEmployeeColumn(data[0].rows);
              setSheets(data);setSheetIndex(0);setColumn(hint.column);setFirstRow(hint.firstRow);setFileName(file.name);setBaseVersion(version);
            }catch(err){setError(err.message);}finally{lock.current=false;setBusy(false);}
          };
          const restore=()=>{
            setRestoring([...current.employeePreviousNames]);setSheets([]);setExcluded(new Set());setMode('replace');
            setMonth(current.employeePreviousMonth || new Date().toISOString().slice(0,7));setFileName('Restauração da lista anterior');setBaseVersion(current.employeeVersion || 'legacy');resetConfirm();
          };
          const save=async()=>{
            if(!diff || !accepted || !month || lock.current || user.uid!==ADMIN_UID)return;
            lock.current=true;setBusy(true);setError('');
            try{
              await runTransaction(db,async transaction=>{
                const target=doc(db,'app_settings','map');const snapshot=await transaction.get(target);
                if(!snapshot.exists())throw new Error('A configuração do sistema não está disponível. Atualize a página e tente novamente.');
                const previous=snapshot.data();
                if((previous.employeeVersion || 'legacy')!==baseVersion)throw new Error('A lista foi atualizada em outra sessão. Selecione o arquivo novamente para conferir a nova prévia.');
                const result=compareEmployees(previous.employeeNames || fallback,extracted.names.filter(name=>!excluded.has(employeeKey(name))),mode);
                transaction.update(target,{employeeNames:result.names,employeeVersion:crypto.randomUUID(),employeePreviousNames:previous.employeeNames || fallback,employeePreviousMonth:previous.employeeMonth || '',employeeMonth:month,employeeSource:fileName.slice(0,255),employeeUpdatedBy:actorFor(user),employeeUpdatedAt:serverTimestamp(),updatedBy:actorFor(user),updatedAt:serverTimestamp()});
              });
              setDone(diff.names.length);
            }catch(err){setError(err.code==='permission-denied'?'Sua conta não tem permissão para atualizar funcionários.':err.message);}
            finally{lock.current=false;setBusy(false);}
          };
          const colLabel=index=>{let text='';for(let n=index+1;n>0;n=Math.floor((n-1)/26))text=String.fromCharCode(65+(n-1)%26)+text;return text;};
          const maxColumns=(sheet?.rows || []).reduce((count,row)=>Math.max(count,row.length),1);
          return <div className="fixed inset-0 z-[550] bg-black/70 p-4 flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="employees-title">
            <div className="bg-white rounded-2xl p-5 max-w-4xl w-full max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between gap-3 items-center mb-3"><h2 id="employees-title" className="font-bold text-xl">Atualizar funcionários</h2><button disabled={busy} onClick={onClose} aria-label="Fechar cadastro de funcionários" className="p-2"><X /></button></div>
              {done!==null?<div role="status" className="bg-green-50 text-green-800 p-5 rounded-lg"><p className="font-bold">Lista atualizada: {done} funcionários disponíveis.</p><p className="mt-2">Os nomes nos diários anteriores foram preservados.</p><button onClick={onClose} className="bg-green-700 text-white px-5 py-2 rounded-lg mt-4">Concluir</button></div>:<>
                <div className="text-sm text-gray-600 mb-4"><p>Lista atual: <strong>{currentNames.length} funcionários</strong>{current.employeeMonth?` • ${current.employeeMonth}`:''}.</p>{current.employeeUpdatedBy&&<p>Atualizada por {current.employeeUpdatedBy.name} • {formatAuditDate(current.employeeUpdatedAt)}</p>}</div>
                <p className="text-sm mb-3">Importe sua lista mensal em Excel (.xlsx ou .xls) ou CSV, até 5 MB. Confira a coluna e a prévia antes de confirmar. Apenas os nomes selecionados serão salvos.</p>
                <input type="file" aria-label="Selecionar planilha de funcionários" accept=".xlsx,.xls,.csv" onChange={choose} disabled={busy} className="w-full mb-4" />
                {current.employeePreviousNames?.length>0&&!sheets.length&&!restoring&&<button onClick={restore} disabled={busy} className="border px-4 py-2 rounded-lg text-sm mb-4">Restaurar lista anterior ({current.employeePreviousNames.length} nomes)</button>}
                {busy&&<p role="status" className="text-sm text-orange-700 mb-3">{sheets.length || restoring?'Salvando lista...':'Lendo planilha...'}</p>}
                {(sheets.length>0 || restoring)&&<>
                  <p className="text-xs text-gray-500 mb-3">{fileName}</p>
                  {sheets.length>0&&<div className="grid sm:grid-cols-3 gap-3 mb-4">
                    <label className="text-sm">Aba<select value={sheetIndex} disabled={busy} onChange={e=>chooseSheet(Number(e.target.value))} className="block w-full p-2 mt-1 border">{sheets.map((item,index)=><option key={index} value={index}>{item.name}</option>)}</select></label>
                    <label className="text-sm">Coluna dos nomes<select value={column} disabled={busy} onChange={e=>{setColumn(Number(e.target.value));setExcluded(new Set());resetConfirm();}} className="block w-full p-2 mt-1 border">{Array.from({length:maxColumns},(_,index)=><option key={index} value={index}>{colLabel(index)}{sheet?.rows?.[Math.max(0,firstRow-2)]?.[index]?` — ${String(sheet.rows[Math.max(0,firstRow-2)][index]).slice(0,45)}`:''}</option>)}</select></label>
                    <label className="text-sm">Primeira linha com funcionário<input type="number" min="1" max="10000" value={firstRow} disabled={busy} onChange={e=>{setFirstRow(Number(e.target.value));setExcluded(new Set());resetConfirm();}} className="block w-full p-2 mt-1 border" /></label>
                  </div>}
                  <div className="grid sm:grid-cols-2 gap-3 mb-4"><label className="text-sm">Mês da lista<input type="month" aria-label="Mês da lista" value={month} onChange={e=>{setMonth(e.target.value);resetConfirm();}} disabled={busy} className="block w-full p-2 mt-1 border" /></label><label className="text-sm">Como atualizar<select aria-label="Como atualizar funcionários" value={mode} onChange={e=>{setMode(e.target.value);resetConfirm();}} disabled={busy || !!restoring} className="block w-full p-2 mt-1 border"><option value="replace">Substituir pela lista do mês</option><option value="merge">Acrescentar nomes novos</option></select></label></div>
                  {extracted.names.length>0&&<div className="border rounded-lg p-3 mb-3"><p className="font-bold text-sm mb-2">Nomes encontrados ({extracted.names.length})</p><div className="max-h-52 overflow-y-auto grid sm:grid-cols-2 gap-1">{extracted.names.map(name=><label key={employeeKey(name)} className="flex gap-2 items-start p-1 text-xs"><input type="checkbox" disabled={busy} checked={!excluded.has(employeeKey(name))} onChange={()=>{setExcluded(prev=>{const next=new Set(prev);const key=employeeKey(name);next.has(key)?next.delete(key):next.add(key);return next;});resetConfirm();}} />{name}</label>)}</div></div>}
                  {extracted.duplicates.length>0&&<p className="text-sm text-gray-600 mb-2">{extracted.duplicates.length} nome(s) repetido(s) removido(s) da importação.</p>}
                  {extracted.rejected.length>0&&<details className="text-sm bg-amber-50 p-3 rounded-lg mb-3"><summary>Linhas ignoradas ({extracted.rejected.length}) — conferir</summary><ul className="max-h-40 overflow-auto mt-2">{extracted.rejected.map(item=><li key={item.row}>Linha {item.row}: {item.value} — {item.reason}</li>)}</ul></details>}
                  {!extracted.names.length&&!previewError&&<p role="alert" className="bg-amber-50 p-3 text-sm">Nenhum nome válido encontrado. Confira a aba, a coluna e a primeira linha.</p>}
                  {previewError&&<p role="alert" className="bg-red-50 p-3 text-red-700 text-sm">{previewError}</p>}
                  {diff&&<><div className="bg-blue-50 rounded-lg p-3 text-sm mb-3"><strong>Lista final: {diff.names.length} nomes</strong> • {diff.added.length} novos • {diff.removed.length} deixam a lista para novos lançamentos.
                    {diff.added.length>0&&<details className="mt-2"><summary>Novos nomes</summary><p className="mt-1 max-h-32 overflow-auto">{diff.added.join(', ')}</p></details>}
                    {diff.removed.length>0&&<details className="mt-2"><summary>Nomes que deixam a lista</summary><p className="mt-1 max-h-32 overflow-auto">{diff.removed.join(', ')}</p></details>}</div>
                    <label className="flex items-start gap-2 text-sm mb-4"><input type="checkbox" disabled={busy} checked={accepted} onChange={e=>setAccepted(e.target.checked)} /><span>Conferi os nomes e confirmo a atualização para os próximos lançamentos. Os diários antigos serão preservados.</span></label></>}
                </>}
                {error&&<p role="alert" className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-3">{error}</p>}
                <div className="flex justify-end gap-3 mt-4"><button disabled={busy} onClick={onClose} className="px-4 py-2 border rounded-lg">Cancelar</button><button disabled={!diff || !accepted || !month || busy} onClick={save} className="bg-orange-600 text-white px-5 py-2 font-bold rounded-lg disabled:opacity-40">{busy?'Aguarde...':'Confirmar atualização'}</button></div>
              </>}
            </div>
          </div>;
        };

        const MapSettings = ({user, current, onClose}) => {
          const [candidate, setCandidate] = useState(null);
          const [busy, setBusy] = useState(false);
          const [error, setError] = useState('');
          const [accepted, setAccepted] = useState(false);
          const [done, setDone] = useState(false);
          const lock = useRef(false);
          useEffect(() => () => { if (candidate?.preview) URL.revokeObjectURL(candidate.preview); }, [candidate]);
          const choose = async e => {
            const file = e.target.files?.[0]; e.target.value = '';
            if (!file || lock.current) return;
            lock.current = true; setBusy(true); setError(''); setAccepted(false); setCandidate(null);
            try {
              const optimized = await optimizeImage(file, 4096, 0.85);
              if (optimized.blob.size > 10 * 1024 * 1024) throw new Error('A imagem otimizada ainda é muito grande. Escolha uma imagem menor.');
              setCandidate({...optimized, name: file.name, originalBytes: file.size, preview: URL.createObjectURL(optimized.blob), baseVersion: current.version});
            } catch (err) { setError(err.message); }
            finally { lock.current = false; setBusy(false); }
          };
          const publish = async () => {
            if (!candidate || !accepted || lock.current || user.uid !== ADMIN_UID) return;
            lock.current = true; setBusy(true); setError('');
            try {
              const version = crypto.randomUUID();
              const path = `mapas/${version}.${candidate.extension}`;
              const target = ref(storage, path);
              await uploadBytes(target, candidate.blob, {contentType: candidate.blob.type, cacheControl: 'public,max-age=31536000,immutable'});
              const url = await getDownloadURL(target);
              await runTransaction(db, async transaction => {
                const configRef = doc(db, 'app_settings', 'map');
                const snapshot = await transaction.get(configRef);
                const previous = snapshot.exists() ? snapshot.data() : DEFAULT_MAP;
                if (previous.version !== candidate.baseVersion) throw new Error('O mapa foi atualizado em outra sessão. Feche esta janela e selecione a imagem novamente.');
                transaction.set(configRef, {...previous, url, path, version, name: candidate.name, width: candidate.width, height: candidate.height, bytes: candidate.blob.size, updatedBy: actorFor(user), updatedAt: serverTimestamp(), previous: {url: previous.url, version: previous.version, name: previous.name || 'Mapa anterior', width: previous.width, height: previous.height}});
              });
              setDone(true);
            } catch (err) { setError(`O mapa atual foi mantido. ${err.code === 'permission-denied' || err.code === 'storage/unauthorized' ? 'Sua conta não tem permissão para publicar o mapa. Verifique as regras do Firebase.' : err.message}`); }
            finally { lock.current = false; setBusy(false); }
          };
          return <div className="fixed inset-0 z-[550] bg-black/70 p-4 flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="map-settings-title">
            <div className="bg-white rounded-2xl p-5 max-w-3xl w-full max-h-[90vh] overflow-y-auto">
              <div className="flex justify-between gap-4 items-center mb-3"><h2 id="map-settings-title" className="font-bold text-xl">Atualizar mapa da obra</h2><button disabled={busy} onClick={onClose} className="p-2" aria-label="Fechar atualização do mapa"><X /></button></div>
              {done ? <div role="status" className="bg-green-50 p-5 text-green-800"><p className="font-bold">Mapa atualizado para todos os usuários.</p><p className="mt-2">Confira o alinhamento das marcações na nova imagem.</p><button onClick={onClose} className="mt-4 bg-green-700 text-white px-5 py-2 rounded-lg">Ver mapa</button></div> : <>
                <p className="text-sm text-gray-600 mb-4">Escolha JPG, PNG ou WebP (até 80 MB). A imagem será otimizada automaticamente, preservando sua proporção.</p>
                <input aria-label="Selecionar novo mapa" type="file" accept="image/jpeg,image/png,image/webp" disabled={busy} onChange={choose} className="w-full mb-4" />
                {candidate && <><img src={candidate.preview} alt="Prévia do novo mapa" className="w-full h-auto rounded-lg border" /><p className="text-xs text-gray-600 mt-2">{candidate.width} × {candidate.height} pixels • {formatBytes(candidate.originalBytes)} → {formatBytes(candidate.blob.size)}</p>
                  <label className="flex gap-3 items-start mt-4 text-sm bg-amber-50 p-3 rounded-lg"><input type="checkbox" checked={accepted} onChange={e => setAccepted(e.target.checked)} disabled={busy} /><span>Conferi a prévia. A troca altera o fundo do mapa para todos; as marcações existentes permanecem nas mesmas coordenadas e podem precisar de ajuste.</span></label></>}
                {error && <p role="alert" className="bg-red-50 text-red-700 p-3 mt-3 rounded-lg">{error}</p>}
                <div className="flex justify-end gap-3 mt-5"><button disabled={busy} onClick={onClose} className="px-4 py-2 border rounded-lg">Cancelar</button><button onClick={publish} disabled={!candidate || !accepted || busy} className="px-5 py-2 bg-orange-600 text-white font-bold rounded-lg disabled:opacity-40">{busy ? 'Preparando e enviando...' : 'Publicar novo mapa'}</button></div>
              </>}
            </div>
          </div>;
        };

        const App = () => {
          const [user, setUser] = useState(null);
          const [mapConfig, setMapConfig] = useState(DEFAULT_MAP);
          const [mapConfigError, setMapConfigError] = useState('');
          const [mapSettingsOpen, setMapSettingsOpen] = useState(false);
          const [employeeSettingsOpen, setEmployeeSettingsOpen] = useState(false);
          const [workerSearch,setWorkerSearch]=useState('');
          const draftOwner = useRef(null);
          const busyRef = useRef(false);
          const isAdmin = user?.uid === ADMIN_UID;
          const [view, setView] = useState("home");
          const [logs, setLogs] = useState([]);
          const [loading, setLoading] = useState(false);
          const [successMsg, setSuccessMsg] = useState("");
          
          // Estados de Alerta Customizado
          const [alertMsg, setAlertMsg] = useState("");
          const [confirmDialog, setConfirmDialog] = useState(null);

          const [filterStartDate, setFilterStartDate] = useState(""); 
          const [filterEndDate, setFilterEndDate] = useState(""); 

          const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));
          const [mapMonth, setMapMonth] = useState(new Date().toISOString().slice(0, 7));
          
          const [isUploading, setIsUploading] = useState(false);
          const [uploadErrorDetails, setUploadErrorDetails] = useState(""); 
          const [restored, setRestored] = useState(false);
          const [editingId, setEditingId] = useState(null);
          const [selectedImage, setSelectedImage] = useState(null);

          const [mapNode, setMapNode] = useState(null);
          const [modalMapNode, setModalMapNode] = useState(null);
          const mapContainerRef = useRef(null);
          const modalInnerMapRef = useRef(null); 
          
          const [localClusters, setLocalClusters] = useState([]);
          const [draggingState, setDraggingState] = useState(null);
          const [mapPinInfo, setMapPinInfo] = useState(null);
          const [mapZoom, setMapZoom] = useState(100); 

          const [pendingPinMove, setPendingPinMove] = useState(null);
          const [initialPinPos, setInitialPinPos] = useState(null);
          const pinDragState = useRef({ moved: false });
          const modalLongPressTimer = useRef(null);

          const activePointers = useRef(new Set());
          const panState = useRef({ active: false, startX: 0, startY: 0, scrollLeft: 0, scrollTop: 0, moved: false, target: null });
          const [isPanningMap, setIsPanningMap] = useState(false);

          const [username, setUsername] = useState("");
          const [password, setPassword] = useState("");
          const [loginError, setLoginError] = useState("");

          const [formData, setFormData] = useState({
            date: new Date().toISOString().split("T")[0],
            startTime: "07:00",
            endTime: "17:00",
            responsible: "",
            weather: "sun",
            crews: [],
            entries: [],
            photos: [], 
            photoUrl: "", 
            notes: "",
          });

          const [tempLocation, setTempLocation] = useState("");
          const [tempItem, setTempItem] = useState("");
          const [tempQty, setTempQty] = useState("");
          const [tempEntryCoords, setTempEntryCoords] = useState(null); 

          const [tempService, setTempService] = useState("");
          const [tempCrewLocation, setTempCrewLocation] = useState("");
          const [selectedWorkers, setSelectedWorkers] = useState([]);
          const employeeNames=Array.isArray(mapConfig.employeeNames)?mapConfig.employeeNames:FUNCIONARIOS;
          useEffect(()=>{setSelectedWorkers(prev=>prev.filter(name=>employeeNames.includes(name)));},[mapConfig.employeeVersion]);

          const [isMapModalOpen, setIsMapModalOpen] = useState(false);
          const [mapModalTarget, setMapModalTarget] = useState(null); 
          const [modalTempCoords, setModalTempCoords] = useState(null);

          const formatDateDisplay = (dateString) => {
            if (!dateString) return "Data Indefinida";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
          };

          useEffect(() => {
            if (view !== 'form' || !user || draftOwner.current !== user.uid) return;
            try { localStorage.setItem(draftKey(user.uid), JSON.stringify({ ...formData, editingId })); }
            catch { console.warn('Não foi possível guardar o rascunho neste aparelho.'); }
          }, [formData, editingId, view, user]);

          useEffect(() => onAuthStateChanged(auth, (currentUser) => {
            draftOwner.current = null;
            setUser(currentUser); setLogs([]); setEditingId(null); setRestored(false);
            setFormData(emptyForm(currentUser)); setView('home'); setMapSettingsOpen(false); setEmployeeSettingsOpen(false); setSelectedWorkers([]); setWorkerSearch('');
            if (!currentUser) return;
            try {
              const saved = JSON.parse(localStorage.getItem(draftKey(currentUser.uid)) || 'null');
              if (saved && Array.isArray(saved.entries) && Array.isArray(saved.crews)) {
                const {editingId: savedId, ...draft} = saved;
                setFormData({...emptyForm(currentUser), ...draft, responsible: savedId ? draft.responsible : actorFor(currentUser).name});
                setEditingId(savedId || null); setRestored(true); setView('form');
              }
            } catch { console.warn('Rascunho inválido ignorado.'); }
            draftOwner.current = currentUser.uid;
          }), []);

          useEffect(() => {
            if (!user) { setMapConfig(DEFAULT_MAP); return; }
            return onSnapshot(doc(db, 'app_settings', 'map'), (snapshot) => {
              const value = snapshot.data();
              setMapConfig(value?.url ? value : DEFAULT_MAP); setMapConfigError('');
            }, () => { setMapConfigError('Não foi possível consultar a configuração do mapa. Verifique sua conexão e as permissões do Firebase.'); });
          }, [user?.uid]);

          useEffect(() => {
            if (!user) return;
            const q = collection(db, DB_COLLECTION);
            const unsubscribe = onSnapshot(q, (snapshot) => {
                const logsData = snapshot.docs.map((doc) => ({
                  id: doc.id,
                  ...doc.data(),
                }));
                logsData.sort((a, b) => {
                  if (a.date > b.date) return -1;
                  if (a.date < b.date) return 1;
                  return 0;
                });
                setLogs(logsData);
              },
              (error) => console.error("Erro Firebase:", error)
            );
            return () => unsubscribe();
          }, [user]);

          useEffect(() => {
            if (isMapModalOpen || view === "map") {
              setMapZoom(100);
            }
          }, [isMapModalOpen, view]);

          useEffect(() => {
            const attachZoom = (node) => {
               if (!node) return null;
               
               let initialDist = 0;
               let initialZoom = 0;
               
               const handleWheel = (e) => {
                  e.preventDefault(); 
                  setMapZoom(prevZoom => {
                     const delta = e.deltaY > 0 ? -40 : 40; 
                     const newZoom = Math.max(100, Math.min(2000, prevZoom + delta));
                     
                     if (newZoom !== prevZoom) {
                        const ratio = newZoom / prevZoom;
                        const rect = node.getBoundingClientRect();
                        
                        const mouseX = e.clientX - rect.left + node.scrollLeft;
                        const mouseY = e.clientY - rect.top + node.scrollTop;
                        
                        requestAnimationFrame(() => {
                           node.scrollLeft = mouseX * ratio - (e.clientX - rect.left);
                           node.scrollTop = mouseY * ratio - (e.clientY - rect.top);
                        });
                     }
                     return newZoom;
                  });
               };

               const handleTouchStart = (e) => {
                  if (e.touches.length === 2) {
                     e.preventDefault();
                     initialDist = Math.hypot(
                         e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY
                     );
                     setMapZoom(prev => { initialZoom = prev; return prev; });
                  }
               };

               const handleTouchMove = (e) => {
                  if (e.touches.length === 2 && initialDist > 0) {
                     e.preventDefault();
                     const dist = Math.hypot(
                         e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY
                     );
                     
                     setMapZoom(prevZoom => {
                        const newZoom = Math.max(100, Math.min(2000, initialZoom * (dist / initialDist)));
                        if (newZoom !== prevZoom) {
                           const ratio = newZoom / prevZoom;
                           const rect = node.getBoundingClientRect();
                           const pinchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                           const pinchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                           
                           const pointX = pinchX - rect.left + node.scrollLeft;
                           const pointY = pinchY - rect.top + node.scrollTop;
                           
                           requestAnimationFrame(() => {
                              node.scrollLeft = pointX * ratio - (pinchX - rect.left);
                              node.scrollTop = pointY * ratio - (pinchY - rect.top);
                           });
                        }
                        return newZoom;
                     });
                  }
               };

               node.addEventListener("wheel", handleWheel, { passive: false });
               node.addEventListener("touchstart", handleTouchStart, { passive: false });
               node.addEventListener("touchmove", handleTouchMove, { passive: false });
               
               return () => {
                  node.removeEventListener("wheel", handleWheel);
                  node.removeEventListener("touchstart", handleTouchStart);
                  node.removeEventListener("touchmove", handleTouchMove);
               };
            };

            const cleanupMap = attachZoom(mapNode);
            const cleanupModal = attachZoom(modalMapNode);

            return () => {
               if (cleanupMap) cleanupMap();
               if (cleanupModal) cleanupModal();
            };
          }, [mapNode, modalMapNode]);

          useEffect(() => {
            if (view !== "map") return;
            const logsDoMes = mapMonth ? logs.filter((log) => log.date.startsWith(mapMonth)) : logs;
            
            let todosOsPontos = [];
            logsDoMes.forEach(log => {
              if(log.entries) {
                log.entries.forEach((entry, idx) => {
                  const coords = entry.mapCoords || COORDENADAS_MAPA[entry.location];
                  if (coords) {
                    todosOsPontos.push({
                      logId: log.id,
                      type: 'producao',
                      itemIndex: idx,
                      location: entry.location,
                      title: entry.item,
                      qty: parseFloat(entry.qty) || 0,
                      date: log.date,
                      top: coords[0],
                      left: coords[1]
                    });
                  }
                });
              }
            });

            const threshold = 3; 
            const novosClusters = [];
            
            todosOsPontos.forEach(ponto => {
              let adicionado = false;
              for (let cluster of novosClusters) {
                const dist = Math.hypot(cluster.top - ponto.top, cluster.left - ponto.left);
                if (dist < threshold) {
                  cluster.items.push(ponto);
                  adicionado = true;
                  break;
                }
              }
              if (!adicionado) {
                novosClusters.push({
                  id: `cluster-${Math.random().toString(36).substr(2, 9)}`,
                  top: ponto.top,
                  left: ponto.left,
                  items: [ponto]
                });
              }
            });

            setLocalClusters(novosClusters);
          }, [logs, mapMonth, view]);

          const handleMapPointerDown = (e) => {
            activePointers.current.add(e.pointerId);

            if (!draggingState && e.target.tagName !== 'BUTTON' && !e.target.closest('.pin-drop')) {
               if (activePointers.current.size > 1) {
                   panState.current.active = false;
                   return;
               }

               panState.current = {
                  active: true,
                  startX: e.clientX,
                  startY: e.clientY,
                  scrollLeft: e.currentTarget.scrollLeft,
                  scrollTop: e.currentTarget.scrollTop,
                  moved: false
               };
               e.currentTarget.setPointerCapture(e.pointerId);
               setIsPanningMap(true);
            }
          };

          const handleMapPointerMove = (e) => {
            if (activePointers.current.size > 1) {
               panState.current.active = false;
               return;
            }

            if (panState.current.active) {
               const dx = e.clientX - panState.current.startX;
               const dy = e.clientY - panState.current.startY;
               
               if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                  panState.current.moved = true;
               }
               
               e.currentTarget.scrollLeft = panState.current.scrollLeft - dx;
               e.currentTarget.scrollTop = panState.current.scrollTop - dy;
            }
            
            if (draggingState && mapContainerRef.current) {
               const dx = e.clientX - draggingState.startX;
               const dy = e.clientY - draggingState.startY;

               if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                  pinDragState.current.moved = true;
               }

               const rect = mapContainerRef.current.getBoundingClientRect();
               let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
               let yPercent = ((e.clientY - rect.top) / rect.height) * 100;
               xPercent = Math.max(0, Math.min(100, xPercent));
               yPercent = Math.max(0, Math.min(100, yPercent));

               setLocalClusters(prev => prev.map(c => 
                  c.id === draggingState.id ? { ...c, top: yPercent, left: xPercent } : c
               ));
            }
          };

          const handleMapPointerUp = async (e) => {
            activePointers.current.delete(e.pointerId);

            if (panState.current.active) {
               panState.current.active = false;
               e.currentTarget.releasePointerCapture(e.pointerId);
               setIsPanningMap(false);
            }

            if (draggingState) {
               const clusterMovido = localClusters.find(c => c.id === draggingState.id);
               setDraggingState(null);
               
               if (clusterMovido) {
                  if (pinDragState.current.moved && initialPinPos && 
                     (Math.abs(clusterMovido.top - initialPinPos.top) > 0.5 || Math.abs(clusterMovido.left - initialPinPos.left) > 0.5)) {
                     
                      setPendingPinMove(clusterMovido); 
                      
                  } else {
                      if (initialPinPos) {
                         setLocalClusters(prev => prev.map(c => c.id === clusterMovido.id ? { ...c, top: initialPinPos.top, left: initialPinPos.left } : c));
                      }
                  }
               }
            }
          };

          const handleMapPointerCancel = (e) => {
            activePointers.current.delete(e.pointerId);
            handleMapPointerUp(e);
          };

          const confirmPinMove = async () => {
            if (!pendingPinMove || !user) return;
            try {
              const updates = {};
              pendingPinMove.items.forEach(item => {
                 if (!updates[item.logId]) {
                     updates[item.logId] = JSON.parse(JSON.stringify(logs.find(l => l.id === item.logId)));
                 }
                 const docData = updates[item.logId];
                 if (item.type === 'producao') {
                     docData.entries[item.itemIndex].mapCoords = [pendingPinMove.top, pendingPinMove.left];
                 } else {
                     docData.crews[item.itemIndex].mapCoords = [pendingPinMove.top, pendingPinMove.left];
                 }
              });

              const batch = writeBatch(db);
              for (const logId in updates) {
                 batch.update(doc(db, DB_COLLECTION, logId), {entries: updates[logId].entries, crews: updates[logId].crews, ...auditFields(user, serverTimestamp(), true)});
              }
              await batch.commit();
            } catch(err) {
              console.error("Erro ao atualizar posição", err);
              setAlertMsg("Erro ao salvar a nova posição.");
            }
            setPendingPinMove(null);
            setInitialPinPos(null);
          };

          const cancelPinMove = () => {
            if (pendingPinMove && initialPinPos) {
                setLocalClusters(prev => prev.map(c => 
                   c.id === pendingPinMove.id ? { ...c, top: initialPinPos.top, left: initialPinPos.left } : c
                ));
            }
            setPendingPinMove(null);
            setInitialPinPos(null);
          };

          const openMapModal = (target) => {
            setMapModalTarget(target);
            setModalTempCoords(tempEntryCoords);
            setIsMapModalOpen(true);
          };

          const handleModalPointerDown = (e) => {
            activePointers.current.add(e.pointerId);
            
            if (e.target.tagName !== 'BUTTON') {
               if (activePointers.current.size > 1) {
                  panState.current.active = false;
                  if (modalLongPressTimer.current) clearTimeout(modalLongPressTimer.current);
                  return;
               }

               panState.current = {
                  active: true,
                  startX: e.clientX,
                  startY: e.clientY,
                  scrollLeft: e.currentTarget.scrollLeft,
                  scrollTop: e.currentTarget.scrollTop,
                  moved: false,
                  target: e.target
               };
               e.currentTarget.setPointerCapture(e.pointerId);
               setIsPanningMap(true);

               const clientX = e.clientX;
               const clientY = e.clientY;

               modalLongPressTimer.current = setTimeout(() => {
                  if (!panState.current.moved && activePointers.current.size === 1) {
                     if (modalInnerMapRef.current) {
                         const rect = modalInnerMapRef.current.getBoundingClientRect();
                         let xPercent = ((clientX - rect.left) / rect.width) * 100;
                         let yPercent = ((clientY - rect.top) / rect.height) * 100;
                         xPercent = Math.max(0, Math.min(100, xPercent));
                         yPercent = Math.max(0, Math.min(100, yPercent));
                         setModalTempCoords([yPercent, xPercent]);
                         if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(50);
                     }
                  }
               }, 500); 
            }
          };

          const handleModalPointerMove = (e) => {
            if (activePointers.current.size > 1) {
               panState.current.active = false;
               if (modalLongPressTimer.current) clearTimeout(modalLongPressTimer.current);
               return;
            }

            if (panState.current.active) {
               const dx = e.clientX - panState.current.startX;
               const dy = e.clientY - panState.current.startY;

               if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                  panState.current.moved = true;
                  if (modalLongPressTimer.current) {
                     clearTimeout(modalLongPressTimer.current);
                     modalLongPressTimer.current = null;
                  }
               }

               e.currentTarget.scrollLeft = panState.current.scrollLeft - dx;
               e.currentTarget.scrollTop = panState.current.scrollTop - dy;
            }
          };

          const handleModalPointerUp = (e) => {
            activePointers.current.delete(e.pointerId);

            if (modalLongPressTimer.current) {
               clearTimeout(modalLongPressTimer.current);
               modalLongPressTimer.current = null;
            }

            if (panState.current.active) {
               const wasMoved = panState.current.moved;
               panState.current.active = false;
               e.currentTarget.releasePointerCapture(e.pointerId);
               setIsPanningMap(false);
               
               if (!wasMoved && modalInnerMapRef.current) {
                  const rect = modalInnerMapRef.current.getBoundingClientRect();
                  let xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                  let yPercent = ((e.clientY - rect.top) / rect.height) * 100;
                  xPercent = Math.max(0, Math.min(100, xPercent));
                  yPercent = Math.max(0, Math.min(100, yPercent));
                  setModalTempCoords([yPercent, xPercent]);
               }
            }
          };

          const handleModalPointerCancel = (e) => {
            activePointers.current.delete(e.pointerId);
            handleModalPointerUp(e);
          };

          const confirmMapSelection = () => {
            if (mapModalTarget === 'entry') setTempEntryCoords(modalTempCoords);
            setIsMapModalOpen(false);
          };

          const startNewLog = () => {
            if (busyRef.current) return;
            localStorage.removeItem(draftKey(user.uid));
            setEditingId(null);
            setUploadErrorDetails("");
            const nameFromEmail = user?.email ? user.email.split("@")[0] : "Admin";
            const formattedName = nameFromEmail.charAt(0).toUpperCase() + nameFromEmail.slice(1);

            setFormData({
                date: new Date().toISOString().split("T")[0],
                startTime: "07:00",
                endTime: "17:00",
                responsible: formattedName,
                weather: "sun",
                crews: [],
                entries: [],
                photos: [],
                photoThumbnails: {}, 
                photoUrl: "", 
                notes: "",
            });
            setTempEntryCoords(null);
            setView("form");
          };

          const handleEditLog = (log) => {
            if (busyRef.current) return;
            setUploadErrorDetails("");
            setFormData({
              date: log.date,
              startTime: log.startTime || "07:00",
              endTime: log.endTime || "17:00",
              responsible: log.responsible,
              weather: log.weather,
              crews: log.crews || [],
              entries: log.entries || [],
              photos: log.photos || (log.photoUrl ? [log.photoUrl] : []),
              photoThumbnails: log.photoThumbnails || {},
              photoUrl: "", 
              notes: log.notes || "",
            });
            setEditingId(log.id);
            setView("form");
          };

          const handleLogin = async (e) => {
            e.preventDefault();
            setLoginError("");
            const fakeEmail = `${username.toLowerCase().trim()}${DOMINIO_PADRAO}`;
            try {
              await signInWithEmailAndPassword(auth, fakeEmail, password);
            } catch (error) {
              setLoginError("Usuário ou senha incorretos.");
            }
          };

          const handleLogout = async () => {
            if (busyRef.current) return;
            await signOut(auth);
            setView("home");
            setUsername("");
            setPassword("");
          };

          const handlePhotoSelect = async (e) => {
            const input = e.target;
            const files = Array.from(input.files || []);
            if (!files.length || !user || busyRef.current) return;
            busyRef.current = true; setIsUploading(true); setUploadErrorDetails('');
            const owner = user.uid;
            let completed = 0;
            try {
              for (const file of files) {
                const full = await optimizeImage(file, 1600, 0.8);
                const thumb = await optimizeImage(full.blob, 320, 0.7);
                const folder = `diarios_fotos/${new Date().toISOString().slice(0,7)}/${owner}_${crypto.randomUUID()}`;
                const fullRef = ref(storage, `${folder}.${full.extension}`);
                const thumbRef = ref(storage, `${folder}_thumb.${thumb.extension}`);
                await uploadBytes(fullRef, full.blob, {contentType: full.blob.type, cacheControl: 'public,max-age=31536000,immutable'});
                const url = await getDownloadURL(fullRef);
                // If a thumbnail fails, retain the successfully uploaded photo.
                let thumbnail = url;
                try {
                  await uploadBytes(thumbRef, thumb.blob, {contentType: thumb.blob.type, cacheControl: 'public,max-age=31536000,immutable'});
                  thumbnail = await getDownloadURL(thumbRef);
                } catch { console.warn('Miniatura indisponível; usando a foto.'); }
                if (auth.currentUser?.uid !== owner) throw new Error('A sessão mudou. Entre novamente.');
                setFormData(prev => ({...prev, photos: [...(prev.photos || []), url], photoThumbnails: {...(prev.photoThumbnails || {}), [url]: thumbnail}}));
                completed++;
              }
            } catch (error) {
              setAlertMsg(`${completed ? completed + ' foto(s) adicionada(s). ' : ''}${error.message || 'Falha no envio. Tente novamente.'}`);
            } finally { busyRef.current = false; setIsUploading(false); input.value = ''; }
          };

          const handleToggleWorker = (name) => {
            setSelectedWorkers(prev => prev.includes(name) ? prev.filter(w => w !== name) : [...prev, name]);
          };

          const handleAddCrew = (e) => {
            e.preventDefault();
            if (!tempService || !tempCrewLocation || selectedWorkers.length === 0) {
              setAlertMsg("Selecione o Serviço, Local e pelo menos 1 funcionário.");
              return;
            }

            if (selectedWorkers.some(name=>!employeeNames.includes(name))) {
              setAlertMsg('A lista de funcionários mudou. Confira sua seleção antes de adicionar a equipe.'); return;
            }
            const newCrew = {
              service: tempService, 
              location: tempCrewLocation, 
              workers: selectedWorkers
            };
            
            setFormData({ ...formData, crews: [...formData.crews, newCrew] });
            setTempService(""); setTempCrewLocation(""); setSelectedWorkers([]);
          };

          const handleAddEntry = (e) => {
            e.preventDefault();
            if (!tempLocation || !tempItem || !tempQty) {
              setAlertMsg("Selecione o Local, Item e Quantidade.");
              return;
            }
            if (!tempEntryCoords) {
              setAlertMsg("Por favor, marque no MAPA onde ocorreu essa produção clicando no botão 'Apontar no Mapa'.");
              return;
            }

            const newEntry = { 
              location: tempLocation, 
              item: tempItem, 
              qty: tempQty,
              mapCoords: tempEntryCoords 
            };
            
            setFormData({ ...formData, entries: [...formData.entries, newEntry] });
            setTempLocation(""); setTempItem(""); setTempQty(""); setTempEntryCoords(null);
          };

          const showSuccess = () => {
            setSuccessMsg(editingId ? "DIÁRIO ATUALIZADO COM SUCESSO! ✅" : "DIÁRIO SALVO COM SUCESSO! ✅");
            setTimeout(() => setSuccessMsg(""), 5000);
          };

          const handleSaveLog = async () => {
            if (!user || busyRef.current) return;
            if (formData.entries.length === 0 && formData.crews.length === 0 && !formData.notes && (!formData.photos || formData.photos.length === 0)) {
              setAlertMsg("Preencha pelo menos uma informação.");
              return;
            }

            busyRef.current = true;
            setLoading(true);
            try {
              const allWorkers = new Set();
              formData.crews.forEach((crew) => crew.workers.forEach((w) => allWorkers.add(w)));
              
              const saveTime = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
              
              const dataToSave = {
                ...logPayload(formData),
                workersCount: allWorkers.size,
                timestampLabel: formatDateDisplay(formData.date),
                savedAtTime: saveTime,

              };

              if (editingId) {
                await runTransaction(db, async transaction => {
                  const target = doc(db, DB_COLLECTION, editingId);
                  const snapshot = await transaction.get(target);
                  if (!snapshot.exists()) throw new Error('Este diário foi excluído. Reabra o histórico.');
                  transaction.update(target, {...dataToSave, ...auditFields(user, serverTimestamp(), true)});
                });
              } else {
                await addDoc(collection(db, DB_COLLECTION), {...dataToSave, ...auditFields(user, serverTimestamp(), false)});
              }

              localStorage.removeItem(draftKey(user.uid));
              setRestored(false);
              setView("history");
              showSuccess();
            } catch (error) {
              setAlertMsg("Erro ao salvar: " + error.message);
            } finally {
              busyRef.current = false;
              setLoading(false);
            }
          };

          const translateWeather = (w) => ({ sun: "ENSOLARADO", cloud: "NUBLADO", rain: "CHUVA" }[w] || w);
          
          const confirmDeleteLog = (id) => {
            setConfirmDialog({
              message: "Tem certeza que deseja apagar este diário?",
              onConfirm: async () => {
                await deleteDoc(doc(db, DB_COLLECTION, id));
                setConfirmDialog(null);
              }
            });
          };

          const getMonthlyReport = () => {
            const reportData = {};
            logs.filter((log) => log.date.startsWith(reportMonth)).forEach((log) => {
              if (log.entries) {
                log.entries.forEach((entry) => {
                  if (!reportData[entry.location]) reportData[entry.location] = {};
                  reportData[entry.location][entry.item] = (reportData[entry.location][entry.item] || 0) + parseFloat(entry.qty);
                });
              }
            });
            return reportData;
          };

          const exportToExcel = () => {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "Data;Responsável;Clima;Início;Fim;Tipo;Local;Item/Serviço;Quantidade/Equipe;Observações\n";

            filteredLogs.forEach(log => {
              const date = formatDateDisplay(log.date);
              const resp = log.responsible;
              const weather = translateWeather(log.weather);
              const start = log.startTime;
              const end = log.endTime;
              const notes = (log.notes || "").replace(/[\n\r]+/g, " ").replace(/;/g, ","); 

              if (log.entries && log.entries.length > 0) {
                log.entries.forEach(entry => {
                  csvContent += `${date};${resp};${weather};${start};${end};PRODUÇÃO;${entry.location};${entry.item};${entry.qty};${notes}\n`;
                });
              }

              if (log.crews && log.crews.length > 0) {
                log.crews.forEach(crew => {
                  const workerList = crew.workers.join(", ");
                  csvContent += `${date};${resp};${weather};${start};${end};EQUIPE;${crew.location};${crew.service};${workerList};${notes}\n`;
                });
              }

              if ((!log.entries || log.entries.length === 0) && (!log.crews || log.crews.length === 0)) {
                csvContent += `${date};${resp};${weather};${start};${end};OBSERVAÇÃO;-;-;-;${notes}\n`;
              }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `diario_obra_export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const filteredLogs = logs.filter((log) => {
            if (filterStartDate && log.date < filterStartDate) return false;
            if (filterEndDate && log.date > filterEndDate) return false;
            return true;
          });

          const LogoComponent = () => {
            if (LOGO_URL) return <img src={LOGO_URL} alt="Logo" className="h-16 w-auto mx-auto mb-4 object-contain" />;
            return <div className="bg-orange-500 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-orange-200"><ClipboardList size={32} color="white" /></div>;
          };

          return (
            <div className="relative">
              {mapSettingsOpen && isAdmin && <MapSettings user={user} current={mapConfig} onClose={() => setMapSettingsOpen(false)} />}
              {employeeSettingsOpen && isAdmin && <EmployeeSettings user={user} current={mapConfig} fallback={FUNCIONARIOS} onClose={()=>setEmployeeSettingsOpen(false)} />}
              {/* --- SISTEMA DE ALERTAS GLOBAIS --- */}
              {alertMsg && (
                <div className="fixed inset-0 z-[600] flex items-center justify-center bg-black/60 p-4">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                    <p className="text-gray-800 font-medium mb-6">{alertMsg}</p>
                    <button onClick={() => setAlertMsg("")} className="w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-gray-800">Entendido</button>
                  </div>
                </div>
              )}

              {confirmDialog && (
                <div className="fixed inset-0 z-[600] flex items-center justify-center bg-black/60 p-4">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                    <p className="text-gray-800 font-medium mb-6">{confirmDialog.message}</p>
                    <div className="flex gap-3">
                      <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-xl font-bold">Cancelar</button>
                      <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-bold shadow-md">Sim, Apagar</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Lógica das Telas */}
              {!user ? (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-6">
                  <div className="bg-white w-full max-w-sm p-8 rounded-2xl shadow-lg border border-gray-100 text-center">
                    <LogoComponent />
                    <h1 className="text-2xl font-bold text-gray-900">Diário de Obra</h1>
                    <form onSubmit={handleLogin} className="space-y-4 text-left mt-8">
                      <div><label className="block text-sm font-bold text-gray-700 mb-1">Usuário</label><div className="relative"><input type="text" required className="w-full bg-gray-50 border p-3 pl-10 outline-none rounded-xl" placeholder="ex: joao" value={username} onChange={(e) => setUsername(e.target.value)} /><User size={18} className="absolute left-3 top-3.5 text-gray-400" /></div></div>
                      <div><label className="block text-sm font-bold text-gray-700 mb-1">Senha</label><div className="relative"><input type="password" required className="w-full bg-gray-50 border p-3 pl-10 outline-none rounded-xl" placeholder="••••••" value={password} onChange={(e) => setPassword(e.target.value)} /><Lock size={18} className="absolute left-3 top-3.5 text-gray-400" /></div></div>
                      {loginError && <div className="text-red-500 text-sm bg-red-50 p-3 rounded-lg flex items-center gap-2"><Lock size={16} /> {loginError}</div>}
                      <button type="submit" className="w-full bg-gray-900 text-white py-3 font-bold rounded-xl shadow-lg hover:bg-gray-800">Entrar</button>
                    </form>
                  </div>
                </div>
              ) : view === "home" ? (
                <div className="min-h-screen bg-gray-50 p-6 flex flex-col items-center justify-center font-sans text-gray-800 relative text-center">
                  <div className="absolute top-4 right-4 flex items-center gap-3">
                    <div className="flex items-center gap-1 bg-white px-3 py-2 rounded-full shadow-sm border border-gray-100 text-green-600 text-xs font-bold">
                      <span className="w-2 h-2 rounded-full bg-green-50 animate-pulse"></span> Online
                    </div>
                    <button onClick={handleLogout} disabled={loading || isUploading} className="flex items-center gap-2 text-xs font-bold px-3 py-2 bg-white rounded-full shadow-sm border text-red-500"><LogOut size={14} /> Sair</button>
                  </div>
                  <LogoComponent />
                  <h1 className="text-3xl font-bold text-gray-900">Diário de Obra</h1>
                  <p className="text-gray-500 mt-2 mb-10">Olá, {actorFor(user).name}</p>
                  
                  <div className="grid gap-4 w-full max-w-sm">
                    <button onClick={startNewLog} className="flex items-center p-6 bg-white rounded-2xl shadow-sm border hover:shadow-md group"><div className="bg-orange-100 p-3 rounded-full mr-4 group-hover:bg-orange-200"><Plus className="text-orange-600" size={24} /></div><div className="text-left"><h3 className="font-bold text-lg text-gray-800">Novo Registro</h3><p className="text-sm text-gray-500">Lançar diário completo</p></div></button>
                    <button onClick={() => setView("history")} className="flex items-center p-6 bg-white rounded-2xl shadow-sm border hover:shadow-md group"><div className="bg-blue-100 p-3 rounded-full mr-4 group-hover:bg-blue-200"><ClipboardList className="text-blue-600" size={24} /></div><div className="text-left"><h3 className="font-bold text-lg text-gray-800">Ver Histórico</h3><p className="text-sm text-gray-500">{logs.length} diários salvos</p></div></button>
                    <button onClick={() => setView("report")} className="flex items-center p-6 bg-white rounded-2xl shadow-sm border hover:shadow-md group"><div className="bg-green-100 p-3 rounded-full mr-4 group-hover:bg-green-200"><BarChart3 className="text-green-600" size={24} /></div><div className="text-left"><h3 className="font-bold text-lg text-gray-800">Relatório Mensal</h3><p className="text-sm text-gray-500">Soma de produção</p></div></button>
                    <button onClick={() => setView("map")} className="flex items-center p-6 bg-white rounded-2xl shadow-sm border hover:shadow-md group"><div className="bg-red-100 p-3 rounded-full mr-4 group-hover:bg-red-200"><MapIcon className="text-red-600" size={24} /></div><div className="text-left"><h3 className="font-bold text-lg text-gray-800">Mapa da Obra</h3><p className="text-sm text-gray-500">Visualizar frentes via GPS</p></div></button>
                    {isAdmin&&<button onClick={()=>setEmployeeSettingsOpen(true)} className="flex items-center p-6 bg-white rounded-2xl shadow-sm border hover:shadow-md group"><div className="bg-purple-100 p-3 rounded-full mr-4"><User className="text-purple-600" size={24}/></div><div className="text-left"><h3 className="font-bold text-lg">Funcionários</h3><p className="text-sm text-gray-500">Importar lista mensal do Excel</p></div></button>}
                  </div>
                </div>
              ) : view === "map" ? (
                <div className="h-[100dvh] w-full overflow-hidden bg-gray-900 font-sans flex flex-col">
                  <div className="bg-white px-6 py-4 shadow-sm flex items-center justify-between z-10 shrink-0">
                    <div className="flex items-center">
                      <button onClick={() => setView("home")} className="p-2 -ml-2 text-gray-600"><ChevronLeft size={24} /></button>
                      <h2 className="ml-2 text-lg font-bold text-gray-800">Mapa de Produção</h2>
                    </div>
                    <div className="flex gap-2 items-center">
                      <input type="month" value={mapMonth} onChange={(e) => setMapMonth(e.target.value)} className="text-sm p-2 bg-gray-100 rounded-lg outline-none border font-bold text-gray-700" />
                      {mapMonth && <button onClick={() => setMapMonth("")} className="text-gray-400 hover:text-red-500"><X size={20}/></button>}
                    </div>
                  </div>
                  
                  {isAdmin && <div className="bg-white px-6 pb-3 flex items-center justify-between gap-3"><span className="text-xs text-gray-500">Mapa: {mapConfig.name || 'Ortofoto outubro/2026'}</span><button onClick={() => setMapSettingsOpen(true)} className="bg-orange-500 text-white px-4 py-2 text-sm font-bold rounded-lg">Atualizar mapa</button></div>}
                  {mapConfigError && <p role="alert" className="bg-amber-50 text-amber-800 p-3 text-sm">{mapConfigError}</p>}
                  <div className="bg-gray-800 text-gray-300 text-xs p-3 text-center border-b border-gray-700 shrink-0">
                     Use o <strong>Scroll do Mouse ou Pinça</strong> para Zoom. Segure e arraste o fundo para mover o mapa.
                  </div>

                  <div 
                    className={`flex-1 min-h-0 overflow-auto bg-gray-900 hide-scroll p-4 sm:p-8 touch-none flex items-start justify-start ${isPanningMap ? 'cursor-grabbing' : 'cursor-grab'}`}
                    ref={setMapNode}
                    onContextMenu={(e) => e.preventDefault()}
                    onPointerDown={handleMapPointerDown}
                    onPointerMove={handleMapPointerMove}
                    onPointerUp={handleMapPointerUp}
                    onPointerCancel={handleMapPointerCancel}
                  >
                    <div 
                      ref={mapContainerRef}
                      className="relative bg-white shadow-2xl overflow-hidden border-4 border-white/10 shrink-0"
                      style={{ width: `${mapZoom}%`, minWidth: '600px' }}
                    >
                      <img src={mapConfig.url} decoding="async" alt="Planta da Obra" className="w-full h-auto block select-none pointer-events-none" draggable="false" />
                      
                      {localClusters.map((cluster) => {
                        return (
                          <div 
                            key={cluster.id}
                            className={`absolute touch-none ${!draggingState || draggingState.id !== cluster.id ? 'cursor-pointer transition-transform hover:scale-110' : 'scale-110 cursor-grabbing'}`}
                            style={{ 
                              top: `${cluster.top}%`, 
                              left: `${cluster.left}%`, 
                              transform: 'translate(-50%, -100%)',
                              zIndex: draggingState?.id === cluster.id ? 100 : 10
                            }}
                            onPointerDown={(e) => {
                               e.stopPropagation();
                               e.target.setPointerCapture(e.pointerId);
                               setDraggingState({ id: cluster.id, startX: e.clientX, startY: e.clientY });
                               setInitialPinPos({ top: cluster.top, left: cluster.left });
                               pinDragState.current.moved = false;
                            }}
                            onClick={(e) => {
                              e.stopPropagation();
                              if(!pinDragState.current.moved) {
                                  setMapPinInfo(cluster);
                              }
                            }}
                          >
                            <div className="relative pointer-events-none">
                               <MapPin 
                                  className="text-orange-500 drop-shadow-md" 
                                  size={36} 
                                  fill="white" 
                                  strokeWidth={2} 
                               />
                               <div className="absolute -bottom-1 left-1/2 w-1.5 h-1.5 bg-black/30 rounded-full blur-[2px] -translate-x-1/2"></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {mapPinInfo && (() => {
                    let totaisPopup = {};
                    mapPinInfo.items.forEach(item => {
                      if (!totaisPopup[item.title]) totaisPopup[item.title] = 0;
                      totaisPopup[item.title] += item.qty;
                    });
                    
                    return (
                    <div className="fixed inset-0 z-[400] flex items-end sm:items-center justify-center bg-black/50 p-4 sm:p-0 animate-in fade-in" onClick={() => setMapPinInfo(null)}>
                      <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all flex flex-col max-h-[85vh]" onClick={(e) => e.stopPropagation()}>
                        <div className="bg-white px-5 py-4 border-b border-gray-100 flex justify-between items-center shrink-0">
                          <div className="flex items-center text-gray-800">
                            <MapPin size={20} className="text-orange-500 mr-2" />
                            <h3 className="font-bold uppercase tracking-tight text-lg">
                              {mapPinInfo.items[0].location}
                            </h3>
                          </div>
                          <button onClick={() => setMapPinInfo(null)} className="p-1.5 rounded-full hover:bg-gray-100 text-gray-400"><X size={20} /></button>
                        </div>
                        <div className="p-0 overflow-y-auto">
                           <table className="w-full text-sm text-left">
                              <thead className="bg-gray-50 border-b border-gray-100">
                                 <tr>
                                    <th className="px-5 py-3 text-gray-900 font-bold">Item</th>
                                    <th className="px-5 py-3 text-right text-gray-900 font-bold">Total</th>
                                 </tr>
                              </thead>
                              <tbody>
                                 {Object.keys(totaisPopup).sort().map((item) => (
                                    <tr key={item} className="border-b border-gray-100 last:border-0">
                                       <td className="px-5 py-3 font-medium text-gray-700">{item}</td>
                                       <td className="px-5 py-3 text-right font-bold text-green-700 text-base">
                                         {totaisPopup[item].toLocaleString("pt-BR")}
                                       </td>
                                    </tr>
                                 ))}
                              </tbody>
                           </table>
                        </div>
                      </div>
                    </div>
                  )})()}

                  {pendingPinMove && (
                    <div className="fixed inset-0 z-[500] flex items-center justify-center bg-black/60 p-4 animate-in fade-in">
                       <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center transform transition-all scale-100">
                          <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-orange-100 mb-4">
                              <MapPin className="h-6 w-6 text-orange-600" />
                          </div>
                          <h3 className="text-lg font-bold text-gray-900 mb-2">Mover Ponto?</h3>
                          <p className="text-sm text-gray-500 mb-6">
                              Você arrastou as produções de <strong>{pendingPinMove.items[0]?.location}</strong> para um novo local. Deseja confirmar e salvar esta alteração?
                          </p>
                          <div className="flex gap-3">
                             <button onClick={cancelPinMove} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl transition-colors">
                                Cancelar
                             </button>
                             <button onClick={confirmPinMove} className="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md">
                                Sim, Salvar
                             </button>
                          </div>
                       </div>
                    </div>
                  )}

                </div>
              ) : view === "report" ? (() => {
                  const reportData = getMonthlyReport();
                  return (
                    <div className="min-h-screen bg-gray-50 font-sans">
                      <div className="bg-white px-6 py-4 shadow-sm flex items-center justify-between sticky top-0 z-10"><div className="flex items-center"><button onClick={() => setView("home")} className="p-2 -ml-2 text-gray-600"><ChevronLeft size={24} /></button><h2 className="ml-2 text-lg font-bold text-gray-800">Relatório</h2></div><button onClick={() => window.print()} className="text-orange-500 p-2"><Printer size={20} /></button></div>
                      <div className="max-w-2xl mx-auto p-6 text-left">
                        <div className="bg-white p-6 rounded-xl shadow-sm border mb-6"><label className="block text-sm font-bold text-gray-500 mb-2 uppercase">Selecione o Mês</label><input type="month" value={reportMonth} onChange={(e) => setReportMonth(e.target.value)} className="w-full bg-gray-50 border p-3 rounded-lg text-lg font-bold outline-none" /></div>
                        {Object.keys(reportData).length === 0 ? <div className="text-center py-20 text-gray-400">Sem dados.</div> : Object.keys(reportData).sort().map((local) => (
                          <div key={local} className="bg-white rounded-xl border mb-6 shadow-sm overflow-hidden"><div className="bg-gray-50 px-4 py-3 border-b font-bold flex items-center"><MapPin size={16} className="mr-2 text-orange-500" />{local}</div><table className="w-full text-sm text-left"><thead className="bg-gray-50/50"><tr><th className="px-4 py-2">Item</th><th className="px-4 py-2 text-right">Total</th></tr></thead><tbody>{Object.keys(reportData[local]).map((item) => (<tr key={item} className="border-b"><td className="px-4 py-3 font-medium">{item}</td><td className="px-4 py-3 text-right font-bold text-green-700">{reportData[local][item].toLocaleString("pt-BR")}</td></tr>))}</tbody></table></div>
                        ))}
                      </div>
                    </div>
                  );
                })() : view === "form" ? (
                <div className="min-h-screen bg-gray-50 font-sans pb-20 text-left">
                  <div className="bg-white px-6 py-4 shadow-sm flex items-center sticky top-0 z-10">
                    <button disabled={isUploading || loading} onClick={() => setView("home")} className="p-2 -ml-2 text-gray-600"><ChevronLeft size={24} /></button>
                    <h2 className="ml-2 text-lg font-bold text-gray-800">{editingId ? 'Editando Diário' : 'Novo Registro'}</h2>
                  </div>
                  
                  {restored && !editingId && (<div className="bg-orange-100 text-orange-800 p-3 text-xs text-center font-bold">⚠️ Dados recuperados após reinício.</div>)}

                  <div className="max-w-md mx-auto p-4 space-y-6">
                    <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                      <div><label className="flex items-center text-sm font-bold text-gray-700 mb-2"><Calendar size={18} className="mr-2 text-orange-500" /> DATA</label><input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} className="w-full bg-gray-50 border border-gray-200 p-3 outline-none rounded-lg" /></div>
